<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- 배경 원 -->
  <circle cx="100" cy="100" r="100" fill="linear-gradient(135deg, #667eea 0%, #764ba2 100%)"/>
  
  <!-- 그라데이션 정의 -->
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="face" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffdbac;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f4c2a1;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="hair" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2c3e50;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#34495e;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- 배경 -->
  <circle cx="100" cy="100" r="100" fill="url(#bg)"/>
  
  <!-- 몸통 (셔츠) -->
  <path d="M 60 160 Q 60 140 80 140 L 120 140 Q 140 140 140 160 L 140 200 L 60 200 Z" fill="#3498db"/>
  
  <!-- 얼굴 -->
  <ellipse cx="100" cy="85" rx="35" ry="40" fill="url(#face)"/>
  
  <!-- 머리카락 -->
  <path d="M 70 60 Q 85 40 100 45 Q 115 40 130 60 Q 135 70 130 80 Q 125 75 120 80 Q 115 75 110 80 Q 105 75 100 80 Q 95 75 90 80 Q 85 75 80 80 Q 75 75 70 80 Q 65 70 70 60 Z" fill="url(#hair)"/>
  
  <!-- 안경 -->
  <circle cx="88" cy="80" r="12" fill="none" stroke="#2c3e50" stroke-width="2"/>
  <circle cx="112" cy="80" r="12" fill="none" stroke="#2c3e50" stroke-width="2"/>
  <line x1="100" y1="80" x2="100" y2="80" stroke="#2c3e50" stroke-width="2"/>
  
  <!-- 눈 -->
  <circle cx="88" cy="80" r="3" fill="#2c3e50"/>
  <circle cx="112" cy="80" r="3" fill="#2c3e50"/>
  
  <!-- 입 -->
  <path d="M 90 95 Q 100 105 110 95" stroke="#2c3e50" stroke-width="2" fill="none"/>
  
  <!-- 코드 관련 장식 요소 -->
  <text x="20" y="30" font-family="monospace" font-size="12" fill="rgba(255,255,255,0.3)">&lt;/&gt;</text>
  <text x="160" y="30" font-family="monospace" font-size="12" fill="rgba(255,255,255,0.3)">{ }</text>
  <text x="30" y="170" font-family="monospace" font-size="10" fill="rgba(255,255,255,0.3)">dev</text>
  <text x="160" y="170" font-family="monospace" font-size="10" fill="rgba(255,255,255,0.3)">JS</text>
</svg>